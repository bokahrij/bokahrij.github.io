<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Tasks</title></head>
<body style="font-family:sans-serif;padding:24px">
<p id="msg">Returning to Magic Tasks&hellip;</p>
<p><a id="link" href="#">Tap here if the app didn't open</a></p>
<script>
  // Hands the Tesla OAuth code to the app (custom scheme). The code is single-use and short-lived.
  var target = "teslamagictasks://callback" + window.location.search;
  document.getElementById("link").href = target;
  window.location.replace(target);
</script>
